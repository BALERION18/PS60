[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vajrax"
version = "0.1.0"
description = "Digital Twin: Antarctic Research Stations — Remote Management Platform"
readme = "README.md"
license = {text = "Proprietary — NCPOR / MoES"}
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    # Messaging & serialization
    "betterproto>=2.0.0b6",
    "gmqtt>=0.6.12",
    "zstandard>=0.22.0",
    # Cryptography
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Async & utilities
    "anyio>=4.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    # Configuration
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    # Object storage (cloud)
    "boto3>=1.34.0",
    "minio>=7.2.0",
    # Redis
    "redis>=5.0.0",
    # ML/AI (cloud)
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    # Monitoring
    "prometheus-client>=0.20.0",
    # Scheduling
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "grpcio-tools>=1.63.0",  # for proto-gen
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.0",
    "types-redis>=4.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "edge*", "cloud*", "simulator*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
log_cli = true
log_cli_level = "INFO"

[settings]
python.github_attestations = false
