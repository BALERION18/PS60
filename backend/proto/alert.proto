syntax = "proto3";
package vajrax;
import "enums.proto";
import "google/protobuf/timestamp.proto";
option go_package = "vajrax/proto";

// A safety or operational alert generated by the Edge.
message Alert {
  string alert_id = 1;         // "{station_id}-{domain}-{unix_ms}-{rand4hex}"
  string station_id = 2;
  Severity severity = 3;
  Domain domain = 4;
  string asset_id = 5;         // nullable
  google.protobuf.Timestamp triggered_at = 6;
  string description = 7;
  string raw_sensor_snapshot_json = 8; // JSON blob of relevant readings at trigger time
  AckState ack_state = 9;
  string acknowledged_by = 10; // nullable — user ID
  google.protobuf.Timestamp acknowledged_at = 11; // nullable
  google.protobuf.Timestamp resolved_at = 12;      // nullable
  bool black_box_activated = 13;
}

// Acknowledgement update — sent Edge→Cloud when crew acks an alert locally.
message AlertAck {
  string alert_id = 1;
  string station_id = 2;
  string acknowledged_by = 3;
  google.protobuf.Timestamp acknowledged_at = 4;
}
